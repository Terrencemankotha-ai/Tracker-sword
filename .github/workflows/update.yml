name: Update CPI data and publish app

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:          # "Run workflow" button for an instant refresh
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest official CPI figures
        id: fetch
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python scripts/fetch_inflation.py

      - name: Save new figures to the repo (only when something changed)
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "cpi-bot"
          git config user.email "cpi-bot@users.noreply.github.com"
          git add data/inflation.json
          git commit -m "CPI update $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
